*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#542014 0,#160806 48%,#050101 100%);color:var(--text)}
body.mode-challenge{background:radial-gradient(circle at top,#233f16 0,#160806 52%,#030101 100%)}body.mode-test{background:radial-gradient(circle at top,#5a1717 0,#160806 52%,#030101 100%)}
.wrap{max-width:980px;margin:auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}.card{background:linear-gradient(180deg,rgba(61,27,18,.97),rgba(28,10,7,.97));border:1px solid rgba(255,211,106,.36);border-radius:22px;box-shadow:0 14px 36px #0008;padding:18px}
.title{text-align:center;font-size:clamp(30px,6vw,62px);font-weight:1000;color:var(--gold);text-shadow:0 2px 0 #5d260a,0 0 24px #ffb02e55;margin:10px 0}.subtitle{text-align:center;color:var(--muted);font-size:clamp(15px,2.4vw,20px)}

.feedback{text-align:center;font-size:clamp(20px,4vw,32px);font-weight:1000;min-height:58px;margin:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.result{text-align:center;font-size:22px;line-height:1.55}.small{font-size:14px;color:var(--muted);text-align:center}.resultTable{margin:12px auto;border-collapse:collapse;font-size:16px}.resultTable td,.resultTable th{padding:6px 14px;border:1px solid #ffd36a44}.correctText{color:var(--ok);font-weight:900}
@media(max-width:700px){.wrap{padding:6px}.card{padding:10px}.topbar{grid-template-columns:68px 1fr 68px;gap:4px}.seal{width:64px;height:64px;font-size:11px}.timeCenter{font-size:42px}.status{font-size:14px;padding:4px}.question{font-size:clamp(21px,6vw,32px);padding:15px 9px}.row .btn{flex:1 1 150px}}


.wordBtn{font:inherit;line-height:1.55;color:inherit;background:transparent;border:2px solid transparent;border-radius:9px;padding:2px 4px;cursor:pointer;vertical-align:baseline;overflow-wrap:anywhere;max-width:100%}
.wordBtn.selected{background:#ffd36a;color:#251006;border-color:#ffd36a}

@media(max-width:480px){.question{font-size:22px}.wordBtn{padding:1px 2px}.prompt{font-size:21px;margin:10px 0}}
.tableScroll{overflow-x:auto}

</style>

<script>
"use strict";
// Sdílená výsledková listina podle vzoru Lovců příslovečných určení.
const SHEET_ID="1pkj1ISkzdtgNphGLGwakezT1WzHJxz-pv2OLnCmfnLk";
const GAS_WEB_APP_URL="https://script.google.com/macros/s/AKfycbzrwi1N_f2ddRf2XsOLBtDEFmcxAdWPpW170_dtGNSXUl8vejZl1dhxkqMYhjdxVs8u/exec";
const RESULTS_SHEET_URL="https://docs.google.com/spreadsheets/d/1pkj1ISkzdtgNphGLGwakezT1WzHJxz-pv2OLnCmfnLk/edit?usp=sharing";
const TIME_LIMIT=20,TEST_COUNT=20,CHALLENGE_TARGET=20,app=document.getElementById("app");
const DATA=JSON.parse(document.getElementById("bank").textContent);
let state={screen:"home",mode:null,name:"",clazz:"",pool:[],index:0,score:0,correct:0,wrongCount:0,streak:0,timer:null,pending:null,locked:false,restart:false,finishSent:false,seenChallenge:new Set()};
const CHEAT_NOTICE_KEY="lovciPredmetu_cheatNotice";
function clearCheatNotice(){try{sessionStorage.removeItem(CHEAT_NOTICE_KEY)}catch(e){}}
function activeProtected(){return ["challenge","test"].includes(state.mode)&&state.screen==="question"&&!state.finishSent}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clearTimer(){clearInterval(state.timer);state.timer=null}function clearPending(){clearTimeout(state.pending);state.pending=null}
function render(html,mode=state.mode){document.body.className=mode?"mode-"+mode:"";app.innerHTML=html;document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){saveTraining();if(activeProtected()){cheatFinish("kliknutí na HLAVNÍ MENU");return}if(state.cheated)clearCheatNotice();clearTimer();clearPending();state.screen="home";state.mode=null;render('<div class="card"><h1 class="title">Lovci předmětů</h1><p class="subtitle">Označ všechny předměty ve větě a klikni na HOTOVO. Pokud ve větě žádný předmět není, klikni na HOTOVO rovnou.<br><strong>'+DATA.length+' úloh • VÝZVA a TEST: '+TIME_LIMIT+' sekund • TRÉNINK: bez času</strong></p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button><button class="btn ghost" data-act="training">TRÉNINK</button></div>'+(RESULTS_SHEET_URL ? '<div class="row">'+sharedResultsLink()+'</div>' : '')+'<p class="small">TEST: 20 náhodných úloh s různým počtem předmětů, každá za 1 bod.<br>VÝZVA: 20 správných odpovědí v řadě = jednička. Chyba nebo vypršení času začíná novou sérii.<br>TRÉNINK: bez času a známkování, se zpětnou vazbou po každé odpovědi.<br>Označ samotné předměty včetně případných předložek. Přívlastky vynech.<br>Například ve větě „Na stejnou otázku odpověděl host pokaždé jinak“ označ <strong>Na</strong> a <strong>otázku</strong>.<br> Výběr slov můžeš kdykoli změnit opětovným kliknutím.<br>Ve VÝZVĚ a TESTU opuštění stránky nebo návrat do menu během pokusu jej ukončí známkou 6. Posouvání a přibližování obrazu nevadí.</p><table class="resultTable"><tr><th>Body v testu</th><th>Známka</th></tr><tr><td>20–18</td><td>1</td></tr><tr><td>17–16</td><td>2</td></tr><tr><td>15–14</td><td>3</td></tr><tr><td>13–12</td><td>4</td></tr><tr><td>11–0</td><td>5</td></tr></table></div>',null)}
function nameScreen(mode){clearPending();state.mode=mode;state.screen="name";render('<div class="card"><h1 class="title">'+(mode==="training"?"TRÉNINK":mode==="challenge"?"VÝZVA":"TEST")+'</h1><div class="nameBox"><input class="input" id="name" autocomplete="name" placeholder="Příjmení žáka" aria-label="Příjmení žáka"><input class="input" id="clazz" placeholder="Třída" aria-label="Třída"><button class="btn '+(mode==="challenge"?"challengeBtn":"testBtn")+'" id="start">ZAČÍT</button>'+'<button class="btn ghost" data-act="home">HLAVNÍ MENU</button>'+'</div></div>');document.getElementById("start").onclick=()=>{const n=document.getElementById("name").value.trim(),c=document.getElementById("clazz").value.trim();if(!n||!c){alert("Vyplň příjmení i třídu.");return}state.name=n;state.clazz=c;start(mode)}}
function sharedResultsLink(){
  return RESULTS_SHEET_URL
    ? '<a class="btn ghost" href="'+esc(RESULTS_SHEET_URL)+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ LISTINA</a>'
    : '';
}

function buildTest(){
  const groups = [0, 1, 2, 3].map(count => shuffle(DATA.filter(item => item.count === count)));
  return shuffle(groups.flatMap(group => group.slice(0, TEST_COUNT / groups.length)));
}
function start(mode){clearCheatNotice();clearTimer();clearPending();state={...state,screen:"question",mode,pool:mode==="test"?buildTest():shuffle(DATA),index:0,score:0,correct:0,wrongCount:0,streak:0,locked:false,restart:false,finishSent:false,cheated:false,cheatSoundPending:false,seenChallenge:new Set()};next()}
function next(){clearTimer();clearPending();if(state.mode==="test"&&state.index>=TEST_COUNT)return finish();if(state.mode!=="test"&&state.index>=state.pool.length){state.seenChallenge.clear();state.pool=shuffle(DATA);state.index=0}state.screen="question";state.current=state.pool[state.index];if(state.mode==="challenge")state.seenChallenge.add(state.current.id);state.locked=false;renderQuestion();if(state.mode!=="training")startTimer()}
function renderQuestion(){
 const q=state.current;state.selected=new Set();state.canSubmitAt=Date.now()+350;
 render('<div class="card"><div class="topbar"><div class="seal '+(state.mode==="challenge"?"challengeSeal":"testSeal")+'">'+(state.mode==="training"?"TRÉNINK":state.mode==="challenge"?"VÝZVA":"TEST")+'</div><div class="timeCenter"><span id="time">'+(state.mode==="training"?"∞":TIME_LIMIT)+'</span><span class="status">ÚLOHA '+(state.index+1)+(state.mode==="test"?"/"+TEST_COUNT+" • BODY "+state.score:state.mode==="training"?" • BEZ ČASU":" • SÉRIE "+state.streak+"/"+CHALLENGE_TARGET)+'</span></div><div class="seal sectionSeal">LOVCI<br>PŘEDMĚTŮ</div></div><div class="prompt">Označ všechny předměty ve větě.</div><div class="question" aria-label="Věta k rozboru">'+q.words.map((w,i)=>'<button type="button" class="wordBtn" data-word="'+i+'" aria-pressed="false">'+esc(w)+'</button>').join(' ')+'</div><p class="small">Označ i předložku, pokud patří k předmětu. Ve větě bez předmětu stiskni HOTOVO bez výběru.</p><div class="row"><button class="btn" id="done">HOTOVO</button></div><div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nextRow"></div>'+(state.mode!=="test"?'<div class="row"><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div>':'')+'</div>');
 document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(state.locked)return;const i=Number(b.dataset.word);if(state.selected.has(i))state.selected.delete(i);else state.selected.add(i);b.classList.toggle('selected',state.selected.has(i));b.setAttribute('aria-pressed',String(state.selected.has(i)));document.getElementById('fb').textContent=''});
 document.getElementById('done').onclick=answer;
}
function correctSentence(q){return q.words.map((w,i)=>q.expected.includes(i)?'<span class="correctText">'+esc(w)+'</span>':esc(w)).join(' ')}
function markChoices(){
  const q = state.current;
  document.querySelectorAll('[data-word]').forEach(button => {
    const index = Number(button.dataset.word);
    button.disabled = true;
    if(q.expected.includes(index)) button.classList.add('correct');
    else if(state.selected.has(index)) button.classList.add('wrong');
  });
  document.getElementById('done').disabled = true;
}

function answer(){
  if(state.locked || state.screen !== "question" || Date.now() < state.canSubmitAt) return;
  if(state.mode !== "training" && Date.now() >= state.deadline) return timeout();
  const {expected} = state.current;
  const good = state.selected.size === expected.length && expected.every(index => state.selected.has(index));
  finishAnswer(good, false);
}
function timeout(){if(!state.locked&&state.screen==="question")finishAnswer(false,true)}
function finishAnswer(good, expired){
  state.locked = true;
  clearTimer();
  markChoices();

  const q = state.current;
  const feedback = document.getElementById("fb");
  if(good){
    state.correct++;
    state.score++;
    state.streak++;
    feedback.innerHTML = '<span class="ok">SPRÁVNĚ!'+(state.mode==="test" ? " +1 BOD" : "")+'</span>';
    soundCorrect();
  }else{
    state.wrongCount++;
    state.streak = 0;
    state.restart = state.mode === "challenge";
    feedback.innerHTML = '<span class="bad">'+(expired ? "ČAS VYPRŠEL" : "CHYBA")+
      (state.restart ? " — VÝZVA ZAČÍNÁ ZNOVU" : "")+'</span>';
    soundWrong();
  }

  if(!good || state.mode === "training"){
    const solution = q.expected.length ? correctSentence(q) : 'Ve větě není žádný předmět.';
    feedback.innerHTML += '<br><span class="small">'+solution+'</span>';
  }
  state.index++;
  if(state.mode === "challenge" && good && state.streak >= CHALLENGE_TARGET){
    finishChallenge();
    return;
  }
  const label = state.restart ? "NOVÁ VÝZVA" :
    state.mode === "test" && state.index === TEST_COUNT ? "VÝSLEDEK" : "DALŠÍ";
  document.getElementById("nextRow").innerHTML = '<button class="btn ghost" data-act="next">'+label+'</button>';
  document.querySelector('[data-act="next"]').onclick = advance;
  if(state.mode !== "training") state.pending = setTimeout(advance, good ? 850 : 4500);
}
function advance(){if(!state.locked||state.screen!=="question")return;clearPending();if(state.restart){let remaining=DATA.filter(q=>!state.seenChallenge.has(q.id));if(remaining.length<CHALLENGE_TARGET){state.seenChallenge.clear();remaining=DATA}state.pool=shuffle(remaining);state.index=0;state.score=0;state.correct=0;state.wrongCount=0;state.streak=0;state.restart=false}next()}
function startTimer(){state.deadline=Date.now()+TIME_LIMIT*1000;updateTime();state.timer=setInterval(()=>{updateTime();if(Date.now()>=state.deadline){clearTimer();timeout()}},100)}
function updateTime(){const e=document.getElementById("time");if(e)e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function grade(s){return s>=18?1:s>=16?2:s>=14?3:s>=12?4:5}
function finishChallenge(){clearTimer();clearPending();state.screen="finish";render('<div class="card"><h1 class="title">VÝZVA SPLNĚNA</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>20 správných odpovědí za sebou — známka 1</b></div><div class="sendStatus" id="sendStatus"></div><div class="row">'+sharedResultsLink()+'<button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(1,"VÝZVA")}
function finish(){clearTimer();clearPending();state.screen="finish";const z=grade(state.score);render('<div class="card"><h1 class="title">VÝSLEDEK TESTU</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>Body:</b> '+state.score+'/'+TEST_COUNT+'<br><b>Známka:</b> '+z+'</div><div class="sendStatus" id="sendStatus"></div><div class="row">'+sharedResultsLink()+'<button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(z,"TEST")}
function buildPayload(z,kind){return{timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:state.mode,oddil:"předměty",body:state.score,celkem:state.mode==="training"?state.correct+state.wrongCount:TEST_COUNT,spravne:state.correct,spatne:state.wrongCount,poznamka:kind,sheetId:SHEET_ID,app:"Lovci předmětů"}}
function renderCheatResult(){render('<div class="card"><h1 class="title">PODVOD</h1><div class="result"><b>Pokus byl ukončen.</b><br>Došlo k opuštění stránky nebo k návratu do hlavního menu během pokusu.<br><br><b>Známka:</b> 6</div><div class="row">'+sharedResultsLink()+'<button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>')}
function cheatFinish(reason){if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen="finish";state.cheatSoundPending=document.visibilityState==="hidden";clearTimer();clearPending();try{sessionStorage.setItem(CHEAT_NOTICE_KEY,JSON.stringify({mode:state.mode,name:state.name,clazz:state.clazz,score:state.score,reason,timestamp:new Date().toISOString()}))}catch(e){}if(!state.cheatSoundPending)soundCheat();sendResult(6,"PODVOD: "+reason,true);renderCheatResult()}
function restoreCheatNotice(){let notice;try{notice=JSON.parse(sessionStorage.getItem(CHEAT_NOTICE_KEY)||"null")}catch(e){}if(!notice)return false;clearCheatNotice();state={...state,screen:"finish",mode:notice.mode==="challenge"?"challenge":"test",name:notice.name||"",clazz:notice.clazz||"",score:Number(notice.score)||0,cheated:true,finishSent:true,cheatSoundPending:false};renderCheatResult();return true}
function saveTraining(urgent=false){
 if(state.mode==="training"&&state.screen==="question"&&state.correct+state.wrongCount>0){
   sendResult("","TRÉNINK",urgent);
 }
}
function sendResult(grade,kind,urgent=false){
 if(state.finishSent)return;
 state.finishSent=true;
 const payload=buildPayload(grade,kind);
 const status=document.getElementById("sendStatus");
 if(!GAS_WEB_APP_URL){
   if(status)status.textContent="Sdílený zápis výsledků zatím není připojen.";
   return;
 }
 const body=new URLSearchParams(Object.entries(payload)).toString();
 const contentType="application/x-www-form-urlencoded;charset=UTF-8";
 const failed=()=>{
   if(status)status.textContent="Odeslání výsledku se nezdařilo.";
 };
 try{
   if(urgent&&navigator.sendBeacon?.(GAS_WEB_APP_URL,new Blob([body],{type:contentType})))return;
   if(status)status.textContent="Odesílám výsledek do sdílené tabulky…";
   fetch(GAS_WEB_APP_URL,{
     method:"POST",
     mode:"no-cors",
     headers:{"Content-Type":contentType},
     body,
     keepalive:true
   }).then(()=>{
     if(status)status.textContent="Požadavek byl odeslán. Zápis ověř ve výsledkové listině.";
   }).catch(failed);
 }catch(e){failed();}
}
let audioContext=null,cheatSoundQueued=false;
function getAudioContext(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!audioContext||audioContext.state==="closed")audioContext=new A();return audioContext}catch(e){return null}}
function scheduleTone(c,freq,dur,gain,delay=0,type="sine"){const start=c.currentTime+Math.max(0,Number(delay)||0),peak=Math.max(.0001,Number(gain)||.08),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(peak,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+dur+.02)}
function tone(freq,dur,gain=.08,delay=0,type="sine"){const c=getAudioContext();if(!c)return;const play=()=>{try{scheduleTone(c,freq,dur,gain,delay,type)}catch(e){}};if(c.state==="running")play();else c.resume().then(()=>{if(c.state==="running")play()}).catch(()=>{})}
function soundCorrect(){tone(760,.09,.08);tone(980,.11,.06,.08)}
function soundWrong(){tone(150,.18,.15)}
function playCheatSound(){tone(1450,1.0,.20,0,"sawtooth");tone(1180,1.0,.17,.48,"sawtooth");tone(1450,1.0,.20,1.0,"sawtooth")}
function soundCheat(){const c=getAudioContext();if(!c)return;if(c.state==="running"){playCheatSound();return}cheatSoundQueued=true;c.resume().then(()=>{if(cheatSoundQueued&&c.state==="running"){cheatSoundQueued=false;playCheatSound()}}).catch(()=>{})}
function unlockAudio(){const c=getAudioContext();if(!c||c.state==="running")return;c.resume().then(()=>{if(cheatSoundQueued&&c.state==="running"){cheatSoundQueued=false;playCheatSound()}}).catch(()=>{})}
document.addEventListener("pointerdown",unlockAudio,{passive:true});document.addEventListener("keydown",unlockAudio);
document.addEventListener("visibilitychange",()=>{if(document.hidden)cheatFinish("přepnutí mimo stránku");else if(state.cheatSoundPending){state.cheatSoundPending=false;soundCheat()}});
window.addEventListener("pagehide",()=>{
 saveTraining(true);
 cheatFinish("opuštění stránky");
});
window.addEventListener("pageshow",event=>{
 if(event.persisted&&state.mode==="training"&&state.finishSent)home();
});
const actions={home:home,training:()=>nameScreen("training"),nameChallenge:()=>nameScreen("challenge"),nameTest:()=>nameScreen("test"),next:advance};if(!restoreCheatNotice())home();
</script>
